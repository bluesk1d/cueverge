name: cueverge

services:
  controller:
    image: ghcr.io/bluesk1d/cueverge@sha256:488907c17a5d109ced0131b85944c1b5b7addf8f45859ef51cd7555f54136e64
    restart: unless-stopped
    init: true
    ports:
      - "192.0.2.10:7000:8000"
      - "192.0.2.10:7443:7443"
    environment:
      CUEVERGE_GUI_ENABLED: "true"
      CUEVERGE_GUI_ADMIN_USERNAME: ${CUEVERGE_GUI_ADMIN_USERNAME:-admin}
      CUEVERGE_GUI_ADMIN_PASSWORD_HASH: ${CUEVERGE_GUI_ADMIN_PASSWORD_HASH:?Set the administrator password hash in your private environment file}
      CUEVERGE_GUI_ALLOWED_ORIGINS: ${CUEVERGE_GUI_ALLOWED_ORIGINS:-https://controller.example.com}
      CUEVERGE_GUI_SECURE_COOKIES: "true"
      CUEVERGE_DEVICE_ENROLLMENT_ENABLED: ${CUEVERGE_DEVICE_ENROLLMENT_ENABLED:-false}
      CUEVERGE_DEVICE_ENROLLMENT_TLS_TERMINATED: ${CUEVERGE_DEVICE_ENROLLMENT_TLS_TERMINATED:-false}
      CUEVERGE_DEVICE_CA_KEY_PASSWORD: ${CUEVERGE_DEVICE_CA_KEY_PASSWORD:-}
      CUEVERGE_DEVICE_LISTENER_ENABLED: ${CUEVERGE_DEVICE_LISTENER_ENABLED:-false}
      CUEVERGE_DEVICE_LISTENER_HOST: "0.0.0.0"
      CUEVERGE_DEVICE_LISTENER_PORT: "7443"
      CUEVERGE_DEVICE_LISTENER_IDENTITIES: ${CUEVERGE_DEVICE_LISTENER_IDENTITIES:-192.0.2.10}
      CUEVERGE_DEVICE_LISTENER_PUBLIC_URL: ${CUEVERGE_DEVICE_LISTENER_PUBLIC_URL:-wss://192.0.2.10:7443/api/device/v2/agent/ws}
    volumes:
      - /share/Container/mounts/cueverge:/var/lib/cueverge
