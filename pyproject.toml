[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cueverge"
version = "0.1.0"
description = "A self-hosted reactive multimedia show engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.4,<3",
  "av>=14,<17",
  "cryptography>=46,<47",
  "fastapi>=0.115,<1",
  "mcp>=2.3,<3",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
]

[project.scripts]
cueverge-media-agent = "cueverge.media_agent.app:main"
cueverge-device-enroll = "cueverge.media_agent.device_enrollment:main"
cueverge-device-rotate = "cueverge.media_agent.device_rotation:main"
cueverge-gui-hash-password = "cueverge.gui.passwords:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cueverge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cueverge"]
mypy_path = "src"
