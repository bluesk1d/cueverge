name: cueverge

services:
  controller:
    image: ghcr.io/bluesk1d/cueverge@sha256:f12593af86f0eb0b8d89d1645a86d42212e13a5a12c0947c1826cf66b727b2d1
    restart: unless-stopped
    init: true
    ports:
      - "${CUEVERGE_HOST_BIND_ADDRESS:?Set the Docker host LAN address in your private environment file}:7000:8000"
      - "${CUEVERGE_HOST_BIND_ADDRESS:?Set the Docker host LAN address in your private environment file}:7443:7443"
    environment:
      CUEVERGE_GUI_ENABLED: "true"
      CUEVERGE_GUI_ADMIN_USERNAME: ${CUEVERGE_GUI_ADMIN_USERNAME:-admin}
      CUEVERGE_GUI_ADMIN_PASSWORD_HASH: ${CUEVERGE_GUI_ADMIN_PASSWORD_HASH:?Set the administrator password hash in your private environment file}
      CUEVERGE_GUI_ALLOWED_ORIGINS: ${CUEVERGE_GUI_ALLOWED_ORIGINS:?Set your HTTPS browser origin in your private environment file}
      CUEVERGE_GUI_SECURE_COOKIES: "true"
      CUEVERGE_DEVICE_ENROLLMENT_ENABLED: ${CUEVERGE_DEVICE_ENROLLMENT_ENABLED:-false}
      CUEVERGE_DEVICE_ENROLLMENT_TLS_TERMINATED: ${CUEVERGE_DEVICE_ENROLLMENT_TLS_TERMINATED:-false}
      CUEVERGE_DEVICE_CA_KEY_PASSWORD: ${CUEVERGE_DEVICE_CA_KEY_PASSWORD:-}
      CUEVERGE_DEVICE_LISTENER_ENABLED: ${CUEVERGE_DEVICE_LISTENER_ENABLED:-false}
      CUEVERGE_DEVICE_LISTENER_HOST: "0.0.0.0"
      CUEVERGE_DEVICE_LISTENER_PORT: "7443"
      CUEVERGE_DEVICE_LISTENER_IDENTITIES: ${CUEVERGE_DEVICE_LISTENER_IDENTITIES:-controller.example.com}
      CUEVERGE_DEVICE_LISTENER_PUBLIC_URL: ${CUEVERGE_DEVICE_LISTENER_PUBLIC_URL:-wss://controller.example.com:7443/api/device/v2/agent/ws}
    volumes:
      - ${CUEVERGE_HOST_DATA_DIRECTORY:?Set an absolute Docker host data directory in your private environment file}:/var/lib/cueverge
